name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bramma-yogam-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check frontend and source
        run: |
          npm ci
          npm run check

      - name: Configure pinned SSH connection
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Deploy pushed commit
        run: |
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            root@160.250.204.230 \
            "deploy ${GITHUB_SHA}"

      - name: Apply production admin password
        env:
          ADMIN_PASSWORD: ${{ secrets.PRODUCTION_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_PASSWORD"
          printf '%s\n' "$ADMIN_PASSWORD" | ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            root@160.250.204.230 \
            'set -euo pipefail
             IFS= read -r new_password
             compose_file=$(find /opt /var/www -maxdepth 4 -type f -name docker-compose.vps.yml -print -quit)
             test -n "$compose_file"
             app_dir=$(dirname "$compose_file")
             env_file="$app_dir/.env"
             test -f "$env_file"
             escaped_password=$(printf "%s" "$new_password" | sed "s/[\\/&]/\\\\&/g")
             if grep -q "^ADMIN_PASSWORD=" "$env_file"; then
               sed -i "s/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=$escaped_password/" "$env_file"
             else
               printf "\nADMIN_PASSWORD=%s\n" "$new_password" >> "$env_file"
             fi
             chmod 600 "$env_file"
             cd "$app_dir"
             docker compose -f "$compose_file" up -d --force-recreate api
             for attempt in $(seq 1 30); do
               if curl --fail --silent http://localhost:4000/api/health >/dev/null; then break; fi
               if [ "$attempt" -eq 30 ]; then exit 1; fi
               sleep 2
             done
             login_status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
               -H "Content-Type: application/json" \
               --data "{\"username\":\"admin\",\"password\":\"$new_password\"}" \
               http://localhost:4000/api/admin/login)
             test "$login_status" = "200"'

      - name: Verify public HTTPS endpoint
        run: curl --fail --silent --show-error https://brahmamfoundation.in/api/health
