services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brahmam}
      POSTGRES_USER: ${POSTGRES_USER:-brahmam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brahmam-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-brahmam}:${POSTGRES_PASSWORD:-brahmam-local-password}@postgres:5432/${POSTGRES_DB:-brahmam}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_BYTES: 10485760
      MAX_ACTIVITY_UPLOAD_BYTES: ${MAX_ACTIVITY_UPLOAD_BYTES:-104857600}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      CASHFREE_ENV: ${CASHFREE_ENV:-sandbox}
      CASHFREE_CLIENT_ID: ${CASHFREE_CLIENT_ID:-}
      CASHFREE_CLIENT_SECRET: ${CASHFREE_CLIENT_SECRET:-}
      CASHFREE_API_VERSION: ${CASHFREE_API_VERSION:-2026-01-01}
    volumes:
      - gallery_uploads:/app/uploads
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  gallery_uploads:
